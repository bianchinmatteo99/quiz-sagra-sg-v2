<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>SGQuiz - Presenter</title>

    <script type="module" src="../firebase-init.ts"></script>

    <link rel="stylesheet" href="../css/pico/css/pico.min.css">
    <link rel="stylesheet" media="screen" href="index.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <header class="container-fluid">
        <h1>Presenter Dashboard</h1>
        <div id="header-actions">
            <span id="question-timer" aria-live="polite" aria-label="Timer domanda"></span>
            <label>
                <input id="mostra-segreti" name="secrets" type="checkbox" role="switch" />
                MOSTRA SEGRETI
            </label>
        </div>
    </header>
    <main id="main-container" class="container-fluid">
        
        <main class="col">
            <section id="quiz-game-current-state" class="panel">
                <div class="quiz-state-layout">
                    <div class="status-box">
                        <span class="status-label">Stato quiz</span>
                        <strong id="quiz-status-value" class="status-value">-</strong>
                    </div>

                    <section class="game-state-section" aria-labelledby="game-specific-title">
                        <h3 id="game-specific-title">Stato del gioco</h3>
                        <div id="game-specific-state">Nessun gioco attivo.</div>
                    </section>
                </div>
            </section>
        </main>

        <div class="resizer col-resizer"></div>

        <main class="col">
            <section id="question-and-answers" class="panel">
                <div class="question-state-layout">
                    <div class="status-box">
                        <span class="status-label">Domanda</span>
                        <strong id="question-status" class="status-value">-</strong>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Squadra</th>
                            <th>Risposta</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="question-answers-body"></tbody>
                </table>
            </section>
        </main>

        <div class="resizer col-resizer"></div>

        <main class="col">
            <section id="ranking" class="panel">
                <h3>Classifica</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Squadra</th>
                            <th>Punti</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body"></tbody>
                </table>
            </section>
        </main>
    </main>

    <script type="module" src="../auth/check-auth.ts"></script>
    <script type="module" src="../common/resizable-containers.ts"></script>
    <script type="module" src="./index.ts"></script>
</body>

</html>
